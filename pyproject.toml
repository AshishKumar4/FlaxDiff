[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flaxdiff"
version = "0.2.10"
description = "A versatile and easy to understand Diffusion library"
readme = "README.md"
authors = [
  { name="Ashish Kumar Singh", email="ashishkmr472@gmail.com" }
]
dependencies = [
    "flax>=0.8.4",
    "jax>=0.4.28",
    "optax>=0.2.2",
    "orbax",
    "numpy",
    "clu",
    "einops",
    "tqdm",
    "grain",
    "termcolor",
    "augmax",
    "albumentations",
    "rich",
    "python-dotenv",
    "transformers",
    "huggingface_hub",
    "wandb",
    # diffusers removed all Flax support upstream (huggingface/diffusers#14169);
    # only needed for the diffusers_unet_simple architecture, the VAE is vendored
    "diffusers>=0.29,<0.35",
]
license = "MIT"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Root-level entrypoints (training.py, training_jepa.py) are importable whether
# pytest is invoked as `pytest` or `python -m pytest`
pythonpath = ["."]
markers = [
    "network: tests that download pretrained weights from the HuggingFace Hub",
]

[tool.setuptools.packages.find]
include = ["flaxdiff*"]